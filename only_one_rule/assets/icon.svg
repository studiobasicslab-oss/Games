<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14172e"/>
      <stop offset="100%" stop-color="#090a11"/>
    </radialGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="50%" stop-color="#c040fb"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Central Rule Target -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="140" fill="none" stroke="url(#neonGlow)" stroke-width="12" stroke-dasharray="20 10"/>
    <polygon points="256,150 350,320 162,320" fill="none" stroke="#ffea00" stroke-width="14" stroke-linejoin="round"/>
    <circle cx="256" cy="265" r="28" fill="#00ff88"/>
  </g>
  
  <!-- Accent Spark -->
  <path d="M256 70 L266 110 L306 120 L266 130 L256 170 L246 130 L206 120 L246 110 Z" fill="#00d4ff"/>
</svg>
