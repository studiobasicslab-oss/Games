<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Arcade | Basic Studio Labs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f5f4ef; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: #4a4a4a; }
        .serif { font-family: 'Instrument Serif', serif; }
        
        .game-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
        }
        .game-card:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1);
        }
        .mascot-float { animation: float 4s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body class="p-8 md:p-20">

    <nav class="max-w-6xl mx-auto mb-16">
        <a href="https://haris-lab.vercel.app/" class="text-stone-400 hover:text-stone-900 transition">&larr; Back to Studio</a>
    </nav>

    <header class="max-w-6xl mx-auto mb-16">
        <h1 class="serif text-6xl text-stone-900 mb-4">The Arcade</h1>
        <p class="text-xl text-stone-500 italic">Experiments, puzzles, and play.</p>
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        
        <!-- Stickman Runner Card -->
        <div class="game-card p-8 rounded-3xl border border-stone-200">
            <div class="w-12 h-12 bg-stone-900 rounded-2xl mb-6 flex items-center justify-center">
                <!-- Simple Stickman Logo SVG -->
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="5" r="2"/>
                    <path d="M12 7v6"/>
                    <path d="M12 10l3-3"/>
                    <path d="M12 10l-3-3"/>
                    <path d="M12 13l2 4"/>
                    <path d="M12 13l-2 4"/>
                </svg>
            </div>
            <h3 class="text-xl font-medium text-stone-800 mb-2">Stickman Runner</h3>
            <p class="text-stone-500 mb-6 text-sm">A quick fun arcade game to help coordinate your hands.</p>
            <a href="stickman_runner/split_screen_stickman_runner.html" class="inline-block px-6 py-2 bg-stone-900 text-white rounded-full text-sm hover:bg-stone-700 transition">Play Now</a>
        </div>

        <!-- Empty State/Placeholder -->
        <div class="p-8 rounded-3xl border-2 border-dashed border-stone-200 flex flex-col justify-center items-center text-center">
            <span class="text-stone-300 text-4xl mb-4">+</span>
            <p class="text-stone-400 text-sm">More Games coming soon...</p>
        </div>

    </main>

    <!-- Mascot -->
    <div class="fixed bottom-10 right-10 mascot-float">
        <img src="image_a3d7a2.jpg" alt="Mascot" class="w-16 h-16 rounded-full border border-stone-200 shadow-lg">
    </div>

</body>
</html>
