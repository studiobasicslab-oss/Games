<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PERFECT SHAPE | Precision Geometry Lab</title>
    <meta name="description" content="Draw shapes with hand precision. Test how close your hand-drawn circles, squares, triangles, stars, and hearts are to mathematical perfection!">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-cyber">
    <div class="app-container">
        <!-- Top Navigation Bar -->
        <header class="game-header">
            <div class="header-left">
                <a href="../index.html" class="nav-back-btn" title="Back to Arcade">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>Arcade</span>
                </a>
                <div class="brand-badge">
                    <span class="pulse-dot"></span>
                    <span class="brand-title">PERFECT SHAPE</span>
                    <span class="brand-sub">LAB</span>
                </div>
            </div>

            <div class="header-center">
                <div class="mode-pills" id="mode-selector">
                    <button class="mode-pill active" data-mode="gauntlet" id="mode-btn-gauntlet">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                        </svg>
                        <span>Levels</span>
                    </button>
                    <button class="mode-pill" data-mode="practice" id="mode-btn-practice">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <circle cx="12" cy="12" r="4"></circle>
                        </svg>
                        <span>Practice</span>
                    </button>
                    <button class="mode-pill" data-mode="rush" id="mode-btn-rush">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                        </svg>
                        <span>Rush (60s)</span>
                    </button>
                    <button class="mode-pill" data-mode="freestyle" id="mode-btn-freestyle">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M4.93 19.07l14.14-14.14"></path>
                        </svg>
                        <span>Auto-Detect</span>
                    </button>
                </div>
            </div>

            <div class="header-right">
                <div class="stat-pill" title="Current best streak">
                    <span class="stat-icon">🔥</span>
                    <span id="streak-counter">0</span>
                </div>
                <div class="stat-pill" title="Total Stars">
                    <span class="stat-icon">⭐</span>
                    <span id="total-stars">0 / 24</span>
                </div>
                <button class="icon-btn" id="theme-toggle-btn" title="Toggle Visual Theme">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
                <button class="icon-btn" id="sound-toggle-btn" title="Toggle Sound">
                    <svg id="sound-icon-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    </svg>
                    <svg id="sound-icon-off" class="hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <line x1="23" y1="9" x2="17" y2="15"></line>
                        <line x1="17" y1="9" x2="23" y2="15"></line>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Sub-Bar / Level & Shape Picker -->
        <section class="control-ribbon" id="control-ribbon">
            <div class="shape-selector-scroll" id="shape-selector-container">
                <!-- Injected via JS based on mode -->
            </div>
            <div class="ribbon-actions">
                <button class="tool-btn active" id="btn-toggle-heatmap" title="Toggle Deviation Heatmap (Green/Red error)">
                    <span>Heatmap</span>
                </button>
                <button class="tool-btn active" id="btn-toggle-ghost" title="Toggle Mathematical Ideal Overlay">
                    <span>Ghost Fit</span>
                </button>
                <button class="tool-btn" id="btn-clear-canvas" title="Clear Canvas">
                    <span>Clear</span>
                </button>
            </div>
        </section>

        <!-- Main Drawing Arena -->
        <main class="drawing-arena">
            <!-- Canvas Container -->
            <div class="canvas-wrapper" id="canvas-wrapper">
                <canvas id="paint-canvas"></canvas>
                
                <!-- Target Prompt Overlay -->
                <div class="target-prompt" id="target-prompt">
                    <div class="target-badge" id="target-badge">LEVEL 1</div>
                    <h2 class="target-instruction" id="target-instruction">Draw a <span class="highlight-shape" id="target-shape-name">Circle</span></h2>
                    <p class="target-hint" id="target-hint">Draw in one smooth continuous stroke</p>
                </div>

                <!-- Live Drawing Info Tag -->
                <div class="live-drawing-indicator hidden" id="live-indicator">
                    <span class="live-dot"></span>
                    <span>Tracking Stroke Precision...</span>
                </div>

                <!-- Rush Timer Bar (for Rush Mode) -->
                <div class="rush-timer-bar hidden" id="rush-timer-container">
                    <div class="rush-time-text">TIME: <span id="rush-timer-val">60s</span> | SCORE: <span id="rush-score-val">0</span></div>
                    <div class="rush-progress-track">
                        <div class="rush-progress-fill" id="rush-progress-fill"></div>
                    </div>
                </div>
            </div>

            <!-- Side / Bottom Analytics Card -->
            <aside class="score-card-panel" id="score-card-panel">
                <div class="score-card-inner">
                    <!-- Radial Dial -->
                    <div class="radial-score-box">
                        <svg class="radial-ring-svg" viewBox="0 0 160 160">
                            <circle class="ring-bg" cx="80" cy="80" r="68"></circle>
                            <circle class="ring-meter" id="ring-meter" cx="80" cy="80" r="68"></circle>
                        </svg>
                        <div class="radial-center-text">
                            <div class="score-percentage" id="score-percentage-text">--%</div>
                            <div class="rank-badge" id="rank-badge">READY</div>
                        </div>
                    </div>

                    <!-- Evaluation Title -->
                    <div class="eval-header">
                        <h3 class="eval-title" id="eval-title">Draw to Begin</h3>
                        <p class="eval-subtitle" id="eval-subtitle">Unleash your muscle memory</p>
                    </div>

                    <!-- Metric Breakdown Grid -->
                    <div class="metrics-grid" id="metrics-grid">
                        <div class="metric-item">
                            <span class="m-label">Consistency</span>
                            <span class="m-val" id="m-val-1">--</span>
                        </div>
                        <div class="metric-item">
                            <span class="m-label">Closure</span>
                            <span class="m-val" id="m-val-2">--</span>
                        </div>
                        <div class="metric-item">
                            <span class="m-label">Symmetry</span>
                            <span class="m-val" id="m-val-3">--</span>
                        </div>
                        <div class="metric-item">
                            <span class="m-label">Smoothness</span>
                            <span class="m-val" id="m-val-4">--</span>
                        </div>
                    </div>

                    <!-- Level Progression / Star Rating -->
                    <div class="level-stars-row" id="level-stars-row">
                        <span class="star-item" id="star-1">★</span>
                        <span class="star-item" id="star-2">★</span>
                        <span class="star-item" id="star-3">★</span>
                    </div>

                    <!-- Action Controls -->
                    <div class="card-actions">
                        <button class="primary-btn" id="btn-next-level">Next Challenge &rarr;</button>
                        <button class="secondary-btn" id="btn-share-card">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                                <polyline points="16 6 12 2 8 6"></polyline>
                                <line x1="12" y1="2" x2="12" y2="15"></line>
                            </svg>
                            <span>Save Snapshot</span>
                        </button>
                    </div>
                </div>
            </aside>
        </main>

        <!-- Toast Notification Container -->
        <div class="toast-container" id="toast-container"></div>
    </div>

    <!-- Hidden canvas for generating high-res export card -->
    <canvas id="export-canvas" width="800" height="800" class="hidden"></canvas>

    <script type="module" src="game.js"></script>
</body>
</html>
